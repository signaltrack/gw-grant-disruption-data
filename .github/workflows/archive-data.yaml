on:
  # TODO: add cron job
  workflow_dispatch:

name: archive-data.yaml

permissions: 
  contents: write

jobs:
  archive-data:
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Download CSVs
        run: |
          for agency in nih ahrq nsf cdc epa samhsa; do
            wget -b -a wget-log -O data/$agency.csv https://data.grant-witness.us/$agency/dl-table.csv
          done
      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Automated data update
      # TODO update CITATION.cff release date with today's date
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5
        