on:
  # TODO: add cron job
  workflow_dispatch: # TODO: add controls of whether to make the release or not

name: archive-data.yaml

permissions: 
  contents: write

jobs:
  archive-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download CSVs
        run: |
          for agency in nih ahrq nsf cdc epa samhsa; do
            wget -b -a wget-log -O data/$agency.csv https://data.grant-witness.us/$agency/dl-table.csv
          done
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
     
      - name: Update release date
        run: | 
          sed -e "s|date-released: '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'|date-released: '$DATE'|" CITATION.cff > CITATION.cff.tmp &&
          mv CITATION.cff.tmp CITATION.cff
        env:
          DATE: ${{ steps.date.outputs.date }}
               
      ## Probably not necessary and involves installing R and `cffr` package. 
      # - name: Validate CITATION.cff
      #   uses: dieghernan/cff-validator@v5
      
      - uses: actions/upload-artifact@v7
        with:
          name: wget-log
          path: wget-log
        
      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Automated data update
          file_pattern: 'data/*'
      
      - uses: WyriHaximus/github-action-get-previous-tag@v2
        id: previous-release
      
      - name: debug
        env:
          DATE: ${{ steps.date.outputs.date }}
          PREV_TAG: ${{ steps.previous-release.outputs.tag }}
          EQUAL: ${{ env.DATE == env.PREV_TAG }}
          INCREMENTED: ${{ join(steps.date.outputs.date, '(1)')}}
        run: |
          echo $DATE\
          echo $PREV_TAG\
          echo $EQUAL\
          echo $INCREMENTED

      - name: Create release
        env: 
          NEW_TAG: |
            ${{ case(
              steps.date.outputs.date == steps.previous-release.outputs.tag, join(steps.date.outputs.date , '(1)'),
              steps.date.outputs.date
            ) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_TAG }}
        